plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uz.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId "uz.jarvis"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    // Doimiy imzo kaliti: har bir yangi APK eskisining ustiga muammosiz o'rnatiladi.
    // Kalit va parollar KODDA SAQLANMAYDI (GitHub'ga chiqmasin):
    //   * kompyuterda — telefon_ilova/keystore.properties fayli (git'ga qo'shilmaydi);
    //   * GitHub Actions'da — JARVIS_KEYSTORE_* maxfiy o'zgaruvchilari (Secrets).
    def kalitSozlama = new Properties()
    def kalitFayli = rootProject.file('keystore.properties')
    if (kalitFayli.exists()) {
        kalitFayli.withInputStream { kalitSozlama.load(it) }
    }
    def ol = { String nom, String muhit -> kalitSozlama.getProperty(nom) ?: System.getenv(muhit) }
    def kalitYoli = ol('storeFile', 'JARVIS_KEYSTORE_FILE')
    def imzoBor = kalitYoli && file(kalitYoli).exists()

    signingConfigs {
        if (imzoBor) {
            doimiy {
                storeFile file(kalitYoli)
                storePassword ol('storePassword', 'JARVIS_KEYSTORE_PASSWORD')
                keyAlias ol('keyAlias', 'JARVIS_KEY_ALIAS') ?: 'jarvis'
                keyPassword ol('keyPassword', 'JARVIS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (imzoBor) signingConfig signingConfigs.doimiy
        }
        release {
            minifyEnabled false
            if (imzoBor) signingConfig signingConfigs.doimiy
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
