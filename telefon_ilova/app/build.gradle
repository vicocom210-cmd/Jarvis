plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uz.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId "uz.jarvis"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "2.5"
    }

    // Doimiy imzo kaliti: har bir yangi APK eskisining ustiga muammosiz o'rnatiladi
    // (aks holda GitHub har safar yangi kalit yaratadi va yangilanish o'rnatilmaydi)
    signingConfigs {
        doimiy {
            storeFile file('jarvis.keystore')
            storePassword 'jarvis123'
            keyAlias 'jarvis'
            keyPassword 'jarvis123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.doimiy
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.doimiy
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
