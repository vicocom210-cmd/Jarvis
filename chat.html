<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis — Chat</title>
<style>
  :root{
    --fon:#070b16; --yon:#0b1122; --karta:#111a30; --karta2:#16223d; --chegara:rgba(120,160,230,.16);
    --matn:#eef3fc; --sust:#8a9bbb; --yorqin:#4bd0ff; --binafsha:#8a6bff; --xira:#1e5ad2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--fon);color:var(--matn);
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{display:flex;overflow:hidden}
  ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:#223253;border-radius:8px}

  /* ---------- chap panel: arxiv ---------- */
  aside{width:290px;flex:0 0 auto;background:var(--yon);border-right:1px solid var(--chegara);
    display:flex;flex-direction:column}
  .brend{display:flex;align-items:center;gap:12px;padding:20px 18px 14px}
  .orb{width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%,#bff0ff,var(--yorqin) 30%,var(--xira) 70%,#0a1330);
    box-shadow:0 0 18px rgba(75,208,255,.45)}
  .brend b{font-size:18px;letter-spacing:3px;
    background:linear-gradient(90deg,var(--yorqin),var(--binafsha));-webkit-background-clip:text;color:transparent}
  .brend small{display:block;color:var(--sust);font-size:12px;letter-spacing:0;margin-top:2px}
  .yangi{margin:4px 14px 10px;padding:12px;border-radius:12px;border:1px solid var(--chegara);
    background:var(--karta);color:var(--matn);font-size:14px;font-weight:600;cursor:pointer;text-align:left}
  .yangi:hover{background:var(--karta2)}
  .qidiruv{margin:0 14px 10px;padding:11px 13px;border-radius:12px;border:1px solid var(--chegara);
    background:#0a1020;color:var(--matn);font-size:14px;outline:none}
  .qidiruv:focus{border-color:var(--yorqin)}
  .kunlar{flex:1;overflow-y:auto;padding:4px 8px 14px}
  .guruh{color:var(--sust);font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    padding:14px 10px 6px}
  .kun{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;
    gap:8px;align-items:center}
  .kun:hover{background:var(--karta)} .kun.faol{background:var(--karta2)}
  .kun span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kun i{font-style:normal;color:var(--sust);font-size:12px;flex:0 0 auto}
  .pastki{padding:12px 16px;border-top:1px solid var(--chegara);color:var(--sust);font-size:12px;line-height:1.5}

  /* ---------- asosiy: suhbat ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bosh{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;
    border-bottom:1px solid var(--chegara)}
  .bosh h1{font-size:16px;font-weight:600}
  .holat{display:flex;align-items:center;gap:8px;color:var(--sust);font-size:13px}
  .nuqta{width:9px;height:9px;border-radius:50%;background:#3b4a66}
  .nuqta.jonli{background:var(--yorqin);box-shadow:0 0 10px var(--yorqin);animation:lip 1s infinite}
  @keyframes lip{50%{opacity:.35}}
  .banner{display:none;margin:12px 26px 0;padding:10px 14px;border-radius:10px;background:#1a2440;
    color:#c9d6ee;font-size:13.5px;justify-content:space-between;align-items:center}
  .banner button{background:none;border:1px solid var(--chegara);color:var(--matn);padding:6px 12px;
    border-radius:8px;cursor:pointer}
  #oqim{flex:1;overflow-y:auto;padding:24px 0 10px}
  .ichki{max-width:820px;margin:0 auto;padding:0 26px;display:flex;flex-direction:column;gap:18px}
  .xabar{display:flex;gap:14px;animation:kir .25s ease}
  @keyframes kir{from{opacity:0;transform:translateY(6px)}}
  .xabar.siz{justify-content:flex-end}
  .xabar .orb{width:30px;height:30px;margin-top:2px}
  .pufak{max-width:78%;font-size:15.5px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
  .siz .pufak{background:linear-gradient(135deg,var(--xira),var(--binafsha));color:#fff;
    padding:11px 16px;border-radius:18px 18px 4px 18px}
  .jarvis .pufak{padding:4px 0;max-width:none}
  .xabar.jarvis > div:last-child{flex:1;min-width:0}
  .meta{font-size:11.5px;color:var(--sust);margin-top:5px}
  .siz .meta{text-align:right;color:#c6d4f5}
  .yozmoqda{display:none;gap:14px;align-items:center}
  .yozmoqda.bor{display:flex}
  .nuqtalar span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;
    background:var(--yorqin);animation:sakra 1.2s infinite}
  .nuqtalar span:nth-child(2){animation-delay:.2s} .nuqtalar span:nth-child(3){animation-delay:.4s}
  @keyframes sakra{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}

  .salom{text-align:center;margin:8vh auto 0;max-width:640px;padding:0 26px}
  .salom .orb{width:74px;height:74px;margin:0 auto 18px;animation:nafas 3s ease-in-out infinite}
  @keyframes nafas{50%{transform:scale(1.07);box-shadow:0 0 34px rgba(75,208,255,.6)}}
  .salom h2{font-size:26px;font-weight:700;margin-bottom:8px}
  .salom p{color:var(--sust);font-size:15px}
  .misollar{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:26px;text-align:left}
  .misol{padding:13px 15px;border-radius:12px;background:var(--karta);border:1px solid var(--chegara);
    cursor:pointer;font-size:14px;line-height:1.4}
  .misol:hover{background:var(--karta2);border-color:rgba(75,208,255,.4)}
  .misol b{display:block;font-size:12px;color:var(--yorqin);margin-bottom:3px}

  .kiritish{padding:10px 26px 22px}
  .quti{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--karta);
    border:1px solid var(--chegara);border-radius:18px;padding:10px 10px 10px 16px}
  .quti:focus-within{border-color:rgba(75,208,255,.55);box-shadow:0 0 0 3px rgba(75,208,255,.08)}
  textarea{flex:1;resize:none;border:none;outline:none;background:none;color:var(--matn);
    font:inherit;font-size:15.5px;line-height:1.5;max-height:180px;padding:6px 0}
  .yubor{width:40px;height:40px;border-radius:12px;border:none;cursor:pointer;flex:0 0 auto;
    background:linear-gradient(135deg,var(--yorqin),var(--binafsha));display:flex;align-items:center;justify-content:center}
  .yubor:disabled{opacity:.35;cursor:default}
  .yubor svg{width:18px;height:18px;fill:#06101f}
  .maslahat{max-width:820px;margin:8px auto 0;color:var(--sust);font-size:12px;text-align:center}
  code{background:#1b2744;padding:1px 6px;border-radius:5px;font-size:12px}
  @media (max-width:760px){aside{display:none}}
</style>
</head>
<body>
<aside>
  <div class="brend"><div class="orb"></div><div><b>JARVIS</b><small>Shaxsiy yordamchi</small></div></div>
  <button class="yangi" onclick="bugungaQayt()">💬  Bugungi suhbat</button>
  <input class="qidiruv" id="qidiruv" placeholder="🔎  Arxivdan qidirish..." oninput="qidir(this.value)">
  <div class="kunlar" id="kunlar"></div>
  <div class="pastki">🎤 "Jarvis" deb gapiring yoki shu yerga yozing.<br>Barcha suhbatlar arxivda saqlanadi.</div>
</aside>
<main>
  <div class="bosh">
    <h1 id="sarlavha">Bugungi suhbat</h1>
    <div class="holat"><div class="nuqta" id="nuqta"></div><span id="holatMatn">Tayyor</span></div>
  </div>
  <div class="banner" id="banner"><span id="bannerMatn"></span><button onclick="bugungaQayt()">Bugunga qaytish</button></div>
  <div id="oqim"><div class="ichki" id="ichki"></div></div>
  <div class="kiritish">
    <div class="quti">
      <textarea id="matn" rows="1" placeholder="Jarvisga yozing... (Enter — yuborish, Shift+Enter — yangi qator)"></textarea>
      <button class="yubor" id="yuborBtn" onclick="yubor()" title="Yuborish">
        <svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
      </button>
    </div>
    <div class="maslahat">Xabar yuborishda <code>/</code> bilan boshlasangiz — xabar tuzatilmasdan, aynan yozganingizdek ketadi.</div>
  </div>
</main>
<script>
const BUGUN = new Date().toLocaleDateString('sv-SE');   // 2026-09-27
let korilayotgan = BUGUN, oxirgiId = 0, kutilmoqda = false;
const ichki = document.getElementById('ichki'), oqim = document.getElementById('oqim');
const matn = document.getElementById('matn');

const MANBA = {ovoz:'🎤 ovoz', chat:'⌨️ chat', yozuv:'⌨️ yozuv', telefon:'📱 telefon', web:'📱 telefon',
               telegram:'✈️ Telegram', uzish:'🎤 ovoz'};
const MISOLLAR = [
  ['Ob-havo', 'Bugun ob-havo qanday?'], ['Valyuta', 'Dollar kursi qancha?'],
  ['Eslatma', '10 daqiqadan keyin choy ichishni eslat'], ['Xabar', "My broga ertaga soat 5 da uchrashamiz deb yoz"],
  ['Fayllar', "C diskdagi games papkasini fleshkaga ko'chir"], ['Kompyuter', 'Kompyuter holati qanday?'],
  ['Musiqa', "YouTube'da Shoxrux qo'shiqlarini qo'y"], ['Brifing', 'Xayrli tong'],
];

function vaqtMatn(t){ const d=new Date(t*1000); return d.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'}); }
function oxirigaTush(){ oqim.scrollTop = oqim.scrollHeight; }

function salomKorsat(){
  ichki.innerHTML = '<div class="salom"><div class="orb"></div><h2>Salom! Nima qilamiz bugun?</h2>'+
    '<p>Buyruq bering, savol bering yoki quyidagilardan birini tanlang.</p><div class="misollar">'+
    MISOLLAR.map(([s,m])=>'<div class="misol" data-m="'+m.replace(/"/g,'&quot;')+'"><b>'+s+'</b>'+m+'</div>').join('')+
    '</div></div>';
  ichki.querySelectorAll('.misol').forEach(el=>el.onclick=()=>{ matn.value=el.dataset.m; yubor(); });
}

function xabarQosh(y){
  if(ichki.querySelector('.salom')) ichki.innerHTML='';
  const siz = y.kim==='siz';
  const d = document.createElement('div'); d.className='xabar '+(siz?'siz':'jarvis');
  if(!siz){ const o=document.createElement('div'); o.className='orb'; d.appendChild(o); }
  const q = document.createElement('div');
  const p = document.createElement('div'); p.className='pufak'; p.textContent=y.matn;
  const m = document.createElement('div'); m.className='meta';
  m.textContent = vaqtMatn(y.vaqt) + (y.manba && MANBA[y.manba] ? '  ·  '+MANBA[y.manba] : '') + (y.sana && y.sana!==korilayotgan ? '  ·  '+y.sana : '');
  q.appendChild(p); q.appendChild(m); d.appendChild(q);
  ichki.insertBefore(d, document.getElementById('yozmoqda'));
}

function yozmoqdaQosh(){
  const d=document.createElement('div'); d.className='yozmoqda'; d.id='yozmoqda';
  d.innerHTML='<div class="orb" style="width:30px;height:30px"></div><div class="nuqtalar"><span></span><span></span><span></span></div>';
  ichki.appendChild(d);
}

async function ol(url){ const r = await fetch(url); return r.json(); }

async function kunOch(sana){
  korilayotgan = sana;
  const bugunmi = sana===BUGUN;
  document.getElementById('sarlavha').textContent = bugunmi ? 'Bugungi suhbat' : sanaChiroyli(sana);
  const banner=document.getElementById('banner');
  banner.style.display = bugunmi ? 'none':'flex';
  document.getElementById('bannerMatn').textContent = '📂 Arxiv: '+sanaChiroyli(sana)+' — faqat o\'qish uchun';
  document.querySelector('.kiritish').style.display = bugunmi ? '' : 'none';
  ichki.innerHTML=''; yozmoqdaQosh();
  const d = await ol('/api/kun?sana='+sana);
  if(!d.yozuvlar.length && bugunmi) salomKorsat();
  d.yozuvlar.forEach(xabarQosh);
  if(bugunmi) oxirgiId = Math.max(oxirgiId, ...d.yozuvlar.map(y=>y.id), 0);
  oxirigaTush(); kunlarniYangila();
}

function sanaChiroyli(s){
  const oylar=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
  const [y,m,k]=s.split('-'); return (+k)+'-'+oylar[+m-1]+', '+y;
}
function guruhNomi(s){
  const farq = Math.round((new Date(BUGUN)-new Date(s))/86400000);
  if(farq===0) return 'Bugun'; if(farq===1) return 'Kecha'; if(farq<7) return 'Shu hafta';
  if(farq<31) return 'Shu oy'; return 'Avvalroq';
}
async function kunlarniYangila(){
  const d = await ol('/api/kunlar'), q = document.getElementById('kunlar');
  q.innerHTML=''; let oldingi='';
  d.kunlar.forEach(k=>{
    const g=guruhNomi(k.sana);
    if(g!==oldingi){ const h=document.createElement('div'); h.className='guruh'; h.textContent=g; q.appendChild(h); oldingi=g; }
    const e=document.createElement('div'); e.className='kun'+(k.sana===korilayotgan?' faol':'');
    e.innerHTML='<span></span><i></i>'; e.firstChild.textContent=k.sarlavha;
    e.lastChild.textContent=k.sana===BUGUN?'':k.sana.slice(5).split('-').reverse().join('.');
    e.title=sanaChiroyli(k.sana)+' — '+k.soni+' ta xabar'; e.onclick=()=>kunOch(k.sana); q.appendChild(e);
  });
}

let qidiruvTaymer=null;
function qidir(s){
  clearTimeout(qidiruvTaymer);
  if(!s.trim()){ kunOch(korilayotgan); return; }
  qidiruvTaymer=setTimeout(async()=>{
    const d = await ol('/api/qidir?q='+encodeURIComponent(s));
    document.getElementById('sarlavha').textContent='Qidiruv: "'+s+'" — '+d.yozuvlar.length+' ta natija';
    ichki.innerHTML=''; yozmoqdaQosh(); korilayotgan='__qidiruv__';
    d.yozuvlar.forEach(xabarQosh); document.querySelector('.kiritish').style.display='none';
  },300);
}
function bugungaQayt(){ document.getElementById('qidiruv').value=''; kunOch(BUGUN); }

async function yubor(){
  const t = matn.value.trim(); if(!t) return;
  matn.value=''; olcham(); kutilmoqda=true; yozmoqdaKorsat(true);
  try{ await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({matn:t})}); }
  catch(e){ yozmoqdaKorsat(false); alert("Jarvis bilan bog'lanib bo'lmadi. Jarvis ishlayaptimi?"); }
}
function yozmoqdaKorsat(bor){ const y=document.getElementById('yozmoqda'); if(y){ y.classList.toggle('bor',bor); if(bor) oxirigaTush(); } }

const HOLATLAR = {kutish:['Tayyor',false], tinglash:['Tinglayapti...',true], "o'ylash":["O'ylayapti...",true],
                  gapirish:['Gapiryapti...',true], shazam:['Musiqani aniqlayapti...',true]};
async function jonli(){
  try{
    const d = await ol('/api/yangi?keyin='+oxirgiId);
    const [h,j] = HOLATLAR[d.holat] || HOLATLAR.kutish;
    document.getElementById('holatMatn').textContent=h;
    document.getElementById('nuqta').classList.toggle('jonli', j);
    if(d.yozuvlar.length){
      oxirgiId = Math.max(oxirgiId, ...d.yozuvlar.map(y=>y.id));
      if(korilayotgan===BUGUN){
        d.yozuvlar.forEach(xabarQosh);
        if(d.yozuvlar.some(y=>y.kim==='jarvis')){ kutilmoqda=false; yozmoqdaKorsat(false); }
        oxirigaTush();
      }
      kunlarniYangila();
    }
    if(korilayotgan===BUGUN) yozmoqdaKorsat(kutilmoqda || d.holat==="o'ylash");
  }catch(e){
    document.getElementById('holatMatn').textContent='Jarvis o\'chiq';
    document.getElementById('nuqta').classList.remove('jonli');
  }
  setTimeout(jonli, 900);
}

function olcham(){ matn.style.height='auto'; matn.style.height=Math.min(matn.scrollHeight,180)+'px';
  document.getElementById('yuborBtn').disabled=!matn.value.trim(); }
matn.addEventListener('input', olcham);
matn.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); yubor(); } });

olcham(); kunOch(BUGUN).then(jonli); matn.focus();
</script>
</body>
</html>
