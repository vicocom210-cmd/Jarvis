name: Jarvis Windows EXE

# Jarvis.exe'ni GitHub o'zi yasaydi (Python o'rnatish shart emas).
# Ishga tushirish: Actions > "Jarvis Windows EXE" > Run workflow.
# Yoki kompyuter kodi (*.py, chat.html) o'zgarsa, avtomatik ishlaydi.
on:
  push:
    paths:
      - "*.py"
      - "chat.html"
      - "jarvis_setup.iss"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  qurish:
    runs-on: windows-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python 3.11 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow SpeechRecognition pyaudio edge-tts pygame pyautogui pyperclip paho-mqtt opencv-python uiautomation pywebview anthropic telethon qrcode cryptography playwright

      - name: Shazam (musiqani aniqlash) — ixtiyoriy
        continue-on-error: true
        run: pip install shazamio

      - name: Oyna sinovi (ustida turadimi, o'rtada chiqadimi)
        run: python sinov_oyna.py

      - name: Yuz tanish modellarini yuklab olish (EXE ichiga)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force modellar | Out-Null
          $asos = "https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models"
          Invoke-WebRequest "$asos/face_detection_yunet/face_detection_yunet_2023mar.onnx" -OutFile modellar\face_detection_yunet_2023mar.onnx
          Invoke-WebRequest "$asos/face_recognition_sface/face_recognition_sface_2021dec.onnx" -OutFile modellar\face_recognition_sface_2021dec.onnx
          Invoke-WebRequest "$asos/object_detection_nanodet/object_detection_nanodet_2022nov.onnx" -OutFile modellar\object_detection_nanodet_2022nov.onnx
          Get-ChildItem modellar | Select-Object Name, Length

      - name: Belgi (ikonka) yasash
        run: python belgi_yasa.py

      - name: Jarvis.exe yig'ish
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Jarvis --icon jarvis.ico
          --add-data "chat.html;."
          --add-data "jarvis.png;."
          --add-data "modellar;modellar"
          --collect-data speech_recognition
          --collect-all uiautomation
          --collect-submodules shazamio
          --collect-all webview
          --collect-submodules anthropic
          --collect-submodules telethon
          --hidden-import telegram_akkaunt
          --hidden-import qrcode
          --hidden-import instagram_brauzer
          --hidden-import sayt
          --hidden-import telegram_javobchi
          --collect-all playwright
          --hidden-import clr
          --hidden-import pyaudio
          jarvis.py

      - name: EXE'ni sinash (hamma modul yuklanadimi?)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Jarvis.exe" -ArgumentList "--tekshir" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "EXE javob bermadi" }
          $log = Join-Path $env:APPDATA "Jarvis\jarvis.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "EXE xato bilan tugadi: $($p.ExitCode)" }
          $hajm = [math]::Round((Get-Item dist\Jarvis.exe).Length / 1MB, 1)
          Write-Host "Jarvis.exe hajmi: $hajm MB"

      - name: Chat oynasi (dastur sifatida) ochilishini sinash
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Jarvis.exe" -ArgumentList "--chat","about:blank" -PassThru
          Start-Sleep -Seconds 12
          $log = Join-Path $env:APPDATA "Jarvis\jarvis.log"
          if ($p.HasExited) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "Chat oynasi ochilmadi (kod: $($p.ExitCode))"
          }
          Write-Host "Chat oynasi ochildi va ishlab turibdi."
          Stop-Process -Id $p.Id -Force

      - name: O'rnatuvchi (Jarvis-Setup.exe) yasash — Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp jarvis_setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup xatosi: $LASTEXITCODE" }
          Get-Item Output\Jarvis-Setup.exe | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - name: O'rnatuvchini sinash (o'rnatib, keyin o'chirib ko'rish)
        shell: pwsh
        run: |
          $p = Start-Process Output\Jarvis-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "O'rnatish xatosi: $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Jarvis\Jarvis.exe"
          if (-not (Test-Path $exe)) { throw "Jarvis.exe o'rnatilmadi: $exe" }
          Write-Host "O'rnatildi: $exe"
          $un = Join-Path $env:LOCALAPPDATA "Programs\Jarvis\unins000.exe"
          $u = Start-Process $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -PassThru -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "O'chirilmadi" }
          Write-Host "O'chirish ham ishladi."

      - name: O'rnatuvchini yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup
          path: Output/Jarvis-Setup.exe
          retention-days: 30

      - name: EXE'ni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-EXE
          path: dist/Jarvis.exe
          retention-days: 30
